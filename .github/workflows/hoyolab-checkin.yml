# 붕괴: 스타레일 HoYoLAB 일일 출석체크 — 매일 1번 자동 실행, 실패할 때만 텔레그램 알림 (+ GitHub 실패 메일)
# 스크립트: scripts/hoyolab-checkin.mjs · 설정 방법: docs/hoyolab-checkin.md
# schedule 은 기본 브랜치(main)에 있는 워크플로만 실행된다.
name: HoYoLAB Check-in

on:
  schedule:
    # 출석 리셋은 UTC+8 자정(= KST 01:00). 그 뒤인 UTC 00:17 = KST 09:17 에 실행
    # (정각은 GitHub 스케줄이 몰려 지연·누락되기 쉬워 분을 비켜 둔다)
    - cron: "17 0 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행 (쿠키 교체 후 확인용)

permissions:
  contents: read

concurrency:
  group: hoyolab-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 스타레일 출석체크
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 재시도 3번(1분 간격)을 포함해도 충분
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 의존성 없는 스크립트라 npm install 이 필요 없다. Secret 값은 GitHub 이 로그에서 자동 마스킹한다
      - name: 출석
        env:
          HOYOLAB_COOKIE: ${{ secrets.HOYOLAB_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/hoyolab-checkin.mjs
